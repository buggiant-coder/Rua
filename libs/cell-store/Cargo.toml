[[test]]
name = "mtime_cache"
path = "tests/mtime_cache.rs"

[[test]]
name = "atomic_update"
path = "tests/atomic_update.rs"

[[test]]
name = "disk_first_writes"
path = "tests/disk_first_writes.rs"

[[test]]
name = "errors"
path = "tests/errors.rs"
