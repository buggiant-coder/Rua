name: E2E Integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_console-e2e-job.yml"
      - ".github/workflows/e2e-integration.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/rua-server/**"
      - "crates/rua-workspace/**"
      - "crates/rua-config/**"
      - "libs/rua-core/**"
      - "libs/rua-contract/**"
      - "console/**"
  schedule:

    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      spec:
        description: "Playwright spec to run"
        required: false
        default: "e2e/baseline.spec.ts"
      auth_enabled:
        description: "Run server with authentication enabled"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  console-e2e:
    strategy:
      fail-fast: false
      matrix:
        spec:
          - "e2e/baseline.spec.ts"
    uses: ./.github/workflows/_console-e2e-job.yml
    with:
      spec: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.spec || matrix.spec }}
      artifact_name: console-e2e-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'baseline' }}
      auth_enabled: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auth_enabled == 'true' }}

  console-login-e2e:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_console-e2e-job.yml
    with:
      spec: "e2e/login.spec.ts"
      artifact_name: console-e2e-login
      auth_enabled: true

  console-debug-e2e:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_console-e2e-job.yml
    with:
      spec: "e2e/debug.spec.ts"
      artifact_name: console-e2e-debug

  console-chat-e2e:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_console-e2e-job.yml
    with:
      spec: "e2e/chat.spec.ts"
      artifact_name: console-e2e-chat

  console-token-usage-e2e:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_console-e2e-job.yml
    with:
      spec: "e2e/token-usage.spec.ts"
      artifact_name: console-e2e-token-usage
      seed_token_usage: true

  console-cron-e2e:
    if: github.event_name == 'schedule'
