name: Install protoc
description: Install protoc 23.4 from the official release asset API
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      with:
        retries: 3
        script: |
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const version = '23.4';
          const platforms = {
            'Linux-X64': 'linux-x86_64',
            'macOS-X64': 'osx-x86_64',
            'macOS-ARM64': 'osx-aarch_64',
            'Windows-X64': 'win64',
          };
          const platform = platforms[`${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}`];
          if (!platform) throw new Error('Unsupported protoc host');
          const repository = { owner: 'protocolbuffers', repo: 'protobuf' };
          const { data: release } = await github.rest.repos.getReleaseByTag({
            ...repository, tag: `v${version}`,
          });
          const name = `protoc-${version}-${platform}.zip`;
          const asset = release.assets.find(asset => asset.name === name);
          if (!asset) throw new Error(`Official protoc asset is missing: ${name}`);
          const { data } = await github.request(
            'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
            { ...repository, asset_id: asset.id, headers: { accept: 'application/octet-stream' } },
          );
          const directory = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'rua-protoc-'));
          const archive = path.join(directory, name);
          const file = await fs.open(archive, 'wx');
          try {
            await file.writeFile(Buffer.from(data));
            await file.sync();
          } finally {
            await file.close();
          }
          await exec.exec('python3', ['-m', 'zipfile', '-e', archive, directory]);
          const bin = path.join(directory, 'bin');
          const executable = path.join(bin, process.env.RUNNER_OS === 'Windows' ? 'protoc.exe' : 'protoc');
          if (process.env.RUNNER_OS !== 'Windows') await fs.chmod(executable, 0o755);
          const { stdout } = await exec.getExecOutput(executable, ['--version']);
          if (stdout.trim() !== `libprotoc ${version}`) throw new Error('Unexpected protoc version');
          core.addPath(bin);
          core.exportVariable('PROTOC', executable);
          core.exportVariable('PROTOC_INCLUDE', path.join(directory, 'include'));
