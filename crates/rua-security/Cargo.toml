[package]
name = "rua-security"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Security guard and audit for rua"
publish = false
autotests = false

[dependencies]
rua-core.workspace = true
rua-config.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
thiserror.workspace = true
dashmap = "6"
regex = "1"
globset = "0.4"
shlex = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "bash_analyzer"
path = "tests/bash_analyzer.rs"

[[test]]
name = "path_overreach"
path = "tests/path_overreach.rs"

[[test]]
name = "contract_guardians"
path = "tests/contract_guardians.rs"
