[package]
name = "rua-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Skills core: types, manifest schema, frontmatter parsing, signature, atomic JSON, file lock"
autotests = false

[dependencies]
cell-store.workspace = true
rua-config.workspace = true
rua-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true

serde_yaml = "0.9"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
include_dir = "0.7"
notify = "7"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
tokio.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[[test]]
name = "builtin_facets"
path = "tests/builtin_facets.rs"

[[test]]
name = "plugin"
path = "tests/plugin.rs"

[[test]]
name = "runtime"
path = "tests/runtime.rs"

[[test]]
name = "core"
path = "tests/core.rs"
