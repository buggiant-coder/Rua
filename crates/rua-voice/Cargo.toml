[package]
name = "rua-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Twilio ConversationRelay voice integration (TTS/ASR/WS) for rua"
publish = false
autotests = false

[dependencies]
rua-core.workspace = true
rua-http.workspace = true
rua-config.workspace = true
rua-contract.workspace = true
rua-workspace.workspace = true
rua-channel.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
arc-swap.workspace = true
reqwest.workspace = true
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
async-stream = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rua-provider = { path = "../rua-provider" }
rua-plugin-runtime = { path = "../rua-plugin-runtime" }
rua-tool = { path = "../rua-tool" }
rua-agent = { path = "../rua-agent" }
rua-security = { path = "../rua-security" }
rua-task.workspace = true
cell-store.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
