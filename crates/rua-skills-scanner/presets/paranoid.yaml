


rule_scoping:
  skip_in_docs: []
  code_only: []
  doc_path_indicators:
    - "docs"
    - "doc"
    - "examples"
    - "tests"
    - "test"
  dedupe_duplicate_findings: true

credentials:
  known_test_values:
    - "AKIAIOSFODNN7EXAMPLE"
    - "AKIAI44QH8DHBEXAMPLE"
    - "EXAMPLEKEYID"
  placeholder_markers:
    - "example"
    - "placeholder"
    - "your-"
    - "your_"
    - "fake"
    - "dummy"
    - "test_"

file_classification:
  inert_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".bmp"
    - ".ico"
    - ".svg"
    - ".webp"
    - ".woff"
    - ".woff2"
    - ".eot"
    - ".ttf"
    - ".otf"
  archive_extensions:
    - ".zip"
    - ".tar"
    - ".gz"
    - ".bz2"
    - ".xz"
    - ".7z"
    - ".rar"

file_limits:
  max_file_count: 50
  max_file_size_bytes: 1048576

severity_overrides:
  COMMAND_INJECTION_EVAL: CRITICAL
  COMMAND_INJECTION_OS_SYSTEM: CRITICAL
  COMMAND_INJECTION_SHELL_TRUE: CRITICAL
  HARDCODED_SECRET_HIGH_ENTROPY: CRITICAL
  PROMPT_INJECTION_SYSTEM_OVERRIDE: CRITICAL
  DATA_EXFILTRATION_NETWORK: HIGH
  OBFUSCATION_BASE64_DECODE: HIGH

disabled_rules: []
