[package]
name = "rua-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tool implementations for rua"
publish = false
autotests = false

[features]
default = ["search", "web", "tasks"]
search = ["dep:grep-regex", "dep:grep-searcher", "dep:ignore", "dep:glob"]
web = [
    "dep:rua-http",
    "dep:rua-mcp",
    "dep:mcp-manager",
    "dep:reqwest",
    "dep:url",
]
tasks = []
browser-tools = ["dep:chromiumoxide", "dep:futures"]

[dependencies]
sha2.workspace = true
cell-store.workspace = true
rua-config.workspace = true
rua-core.workspace = true
rua-contract.workspace = true
rua-text-search.workspace = true
rua-json-repair.workspace = true
agent-types.workspace = true
rua-acp = { workspace = true }
rua-security = { workspace = true }
rua-mcp = { workspace = true, optional = true }
mcp-manager = { workspace = true, optional = true }
rua-session = { path = "../rua-session" }
rua-task.workspace = true
rua-usage.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
vte = "0.14"
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time", "fs", "io-util", "rt", "net"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["clock"] }
chrono-tz = "0.10"
md-5.workspace = true
dirs = "6"


grep-regex = { version = "0.1", optional = true }
grep-searcher = { version = "0.1", optional = true }
ignore = { version = "0.4", optional = true }
glob = { version = "0.3", optional = true }


reqwest = { workspace = true, optional = true }
rua-http = { workspace = true, optional = true }
url = { version = "2", optional = true }


chromiumoxide = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rua-plugin-runtime.workspace = true
agent-client-protocol = "1.3.0"
rua-acp = { workspace = true }
rua-config = { workspace = true }
rua-contract = { workspace = true }
rua-security = { workspace = true }
llm-multiplex.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
reqwest = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "browser"
path = "tests/browser.rs"
required-features = ["browser-tools"]

[[test]]
name = "contract_tools"
path = "tests/contract_tools.rs"
