tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
subtle = "2"
tracing-appender = "0.2"
hyper.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
blake3.workspace = true
rusqlite.workspace = true

notify = "7"


anyhow.workspace = true
mime_guess = "2"
bytes = "1"
http = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
base64 = "0.22"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
tempfile = "3"
dirs = "6"
reqwest.workspace = true
rand.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
tokio-tungstenite.workspace = true
wiremock = "0.6"
serial_test = "3"
futures-util = "0.3"
iroh-blobs.workspace = true
iroh-docs.workspace = true

[features]
imessage = ["rua-workspace/imessage"]
sip-livekit = ["rua-workspace/sip-livekit"]
matrix = ["rua-workspace/matrix"]
mqtt = ["rua-workspace/mqtt"]
default = []
browser-tools = []
office-tools = []
local-inference = []
wasm-runtime = []
mobile-default = []
mobile-full = ["mobile-default", "browser-tools", "office-tools", "local-inference", "wasm-runtime"]
mobile-dev = ["mobile-default"]
external-im = []
metrics = ["rua-observability/metrics"]

[[test]]
name = "contract_desktop_automation"
path = "tests/contract_desktop_automation.rs"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cua-driver-core = { git = "https://github.com/trycua/cua", rev = "85e2b1318bd77ccf3cfa88ccdf875a4bb7eaed19", default-features = false }
cua-driver-contract = { git = "https://github.com/trycua/cua", rev = "85e2b1318bd77ccf3cfa88ccdf875a4bb7eaed19" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
