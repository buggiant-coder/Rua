[package]
name = "rua-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plugin subprocess and JSON-RPC protocol runtime (no OS sandbox)"
publish = false
autotests = false

[dependencies]
rua-core.workspace = true
rua-http.workspace = true
rua-mcp.workspace = true
rua-skills.workspace = true
futures.workspace = true
mcp-manager.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "7"
tempfile = "3"
tokio.workspace = true
tokio-util = "0.7"
thiserror.workspace = true
tracing.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net"] }

[[test]]
name = "all"
path = "tests/all.rs"
