command.prompts.empty:
  zh: |
    **活跃提示词文件**

    - （无 — 空白提示词）

    使用 `/prompt add <文件>` 添加，`/prompt reset` 恢复默认。
  en: |
    **Active Prompt Files**

    - (none — blank prompt)

    Use `/prompt add <file>` to add, `/prompt reset` to restore defaults.
  ja: |
    **アクティブなプロンプトファイル**

    - （なし — 空白プロンプト）

    `/prompt add <ファイル>` で追加、`/prompt reset` でデフォルトに戻します。
  ru: |
    **Активные файлы промптов**

    - (нет — пустой промпт)

    Используйте `/prompt add <файл>` для добавления, `/prompt reset` для восстановления значений по умолчанию.

