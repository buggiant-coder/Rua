command.message.usage:
  zh: |
    **用法：/message <索引>**

    - 示例：/message 1（显示第一条消息）
    - 可用消息：1 到 {count}
  en: |
    **Usage: /message <index>**

    - Example: /message 1 (show first message)
    - Available messages: 1 to {count}
  ja: |
    **使用法：/message <インデックス>**

    - 例：/message 1（最初のメッセージを表示）
    - 利用可能なメッセージ：1 から {count}
  ru: |
    **Использование: /message <индекс>**

    - Пример: /message 1 (показать первое сообщение)
    - Доступные сообщения: от 1 до {count}

