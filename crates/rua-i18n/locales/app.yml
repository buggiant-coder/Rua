    - Текущий контекст пуст
    - Сжатая сводка очищена
    - Действие не выполнено

command.new.disabled:
  zh: |
    **上下文管理器已禁用**

    - 无法启动带摘要的新对话
    - 启用上下文管理器以使用此功能
  en: |
    **Context Manager Disabled**

    - Cannot start new conversation with summary
