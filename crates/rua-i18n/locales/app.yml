command.long_term_memory.not_configured:
  zh: |
    **长期记忆不可用**

    - 此智能体未配置长期记忆
  en: |
    **Long-Term Memory Not Available**

    - Long-term memory is not configured for this agent
  ja: |
    **長期メモリが利用できません**

    - このエージェントには長期メモリが設定されていません
  ru: |
    **Долговременная память недоступна**

    - Долговременная память не настроена для этого агента

command.long_term_memory.not_available:
  zh: |
    **长期记忆不可用**

    - 此记忆实例不存在 `_long_term_memory` 属性
    - 此功能需要兼容 ReMeInMemoryMemory 的记忆后端
  en: |
    **Long-Term Memory Not Available**

    - `_long_term_memory` attribute does not exist on this memory instance
    - This feature requires a ReMeInMemoryMemory-compatible memory backend
  ja: |
    **長期メモリが利用できません**

    - このメモリインスタンスに `_long_term_memory` 属性が存在しません
    - この機能には ReMeInMemoryMemory 互換のメモリバックエンドが必要です
  ru: |
    **Долговременная память недоступна**

    - Атрибут `_long_term_memory` не существует в этом экземпляре памяти
    - Эта функция требует совместимый с ReMeInMemoryMemory бэкенд памяти

command.long_term_memory.empty:
  zh: |
    **长期记忆为空**

    - `_long_term_memory` 已存在但尚无内容
  en: |
    **Long-Term Memory Empty**

    - `_long_term_memory` exists but contains no content yet
  ja: |
    **長期メモリは空です**

    - `_long_term_memory` は存在しますがまだ内容がありません
  ru: |
    **Долговременная память пуста**

    - `_long_term_memory` существует, но пока не содержит данных

