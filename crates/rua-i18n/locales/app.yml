_version: 2

command.clear.body:
  zh: |
    **历史已清除！**

    - 此时间点之前的消息不会发送给智能体
    - 完整历史已保存在磁盘上
  en: |
    **History Cleared!**

    - Messages before this point will not be sent to the agent
    - Full history is preserved on disk
  ja: |
    **履歴がクリアされました！**

    - この時点より前のメッセージはエージェントに送信されません
    - 完全な履歴はディスクに保存されています
  ru: |
    **История очищена!**

    - Сообщения до этого момента не будут отправлены агенту
    - Полная история сохранена на диске

command.common.session_not_available:
  zh: |
    会话不可用。
  en: |
    Session not available.
  ja: |
    セッションが利用できません。
  ru: |
    Сессия недоступна.

command.common.load_messages_error:
  zh: |
    消息加载失败：{error}
  en: |
    Failed to load messages: {error}
  ja: |
    メッセージの読み込みに失敗しました：{error}
  ru: |
    Не удалось загрузить сообщения: {error}

command.common.no_agent_context:
  zh: |
    **没有智能体上下文。**
  en: |
    **No agent context.**
  ja: |
    **エージェントコンテキストがありません。**
  ru: |
    **Нет контекста агента.**

command.compact.no_messages:
  zh: |
    **没有消息可压缩。**

    - 当前上下文为空
    - 未执行任何操作
  en: |
    **No messages to compact.**

    - Current context is empty
    - No action taken
  ja: |
    **圧縮するメッセージがありません。**

    - 現在のコンテキストは空です
    - 操作は行われませんでした
  ru: |
    **Нет сообщений для сжатия.**

    - Текущий контекст пуст
    - Действие не выполнено

command.compact.disabled:
  zh: |
    **上下文管理器已禁用**

    - 上下文压缩功能不可用
    - 启用上下文管理器以使用此功能
  en: |
    **Context Manager Disabled**

    - Context compaction is not available
    - Enable context manager to use this feature
  ja: |
    **コンテキストマネージャーが無効です**

    - コンテキスト圧縮は利用できません
    - この機能を使用するにはコンテキストマネージャーを有効にしてください
  ru: |
    **Менеджер контекста отключён**

    - Сжатие контекста недоступно
    - Включите менеджер контекста для использования этой функции

command.compact.no_window:
  zh: |
    **没有消息可压缩。**

    - 当前窗口为空
    - 未执行任何操作
  en: |
    **No messages to compact.**

    - Current window is empty
    - No action taken
  ja: |
    **圧縮するメッセージがありません。**

    - 現在のウィンドウは空です
    - 操作は行われませんでした
  ru: |
    **Нет сообщений для сжатия.**

    - Текущее окно пусто
    - Действие не выполнено

command.compact.failed:
  zh: |
    **压缩失败！**

    - 上下文压缩返回空结果
    - 请检查日志了解详情
    - 如果上下文超出最大长度，请使用 `/new` 或 `/clear` 清除上下文
  en: |
    **Compact Failed!**

    - Context compaction returned empty result
    - Please check the logs for details
    - If context exceeds max length, please use `/new` or `/clear` to clear the context
  ja: |
    **圧縮に失敗しました！**

    - コンテキスト圧縮が空の結果を返しました
    - 詳細はログを確認してください
    - コンテキストが最大長を超えた場合は `/new` または `/clear` でコンテキストをクリアしてください
  ru: |
    **Сжатие не удалось!**

    - Сжатие контекста вернуло пустой результат
    - Проверьте логи для подробностей
    - Если контекст превышает максимальную длину, используйте `/new` или `/clear` для очистки контекста

command.compact.error:
  zh: |
    压缩错误：{error}
  en: |
    Compaction error: {error}
  ja: |
    圧縮エラー：{error}
  ru: |
    Ошибка сжатия: {error}

command.compact.done:
  zh: |
    **压缩完成！**

    - 已压缩消息数：{count}
    **压缩摘要：**
    {summary}
    - 摘要任务已在后台启动
  en: |
    **Compact Complete!**

    - Messages compacted: {count}
    **Compressed Summary:**
    {summary}
    - Summary task started in background
  ja: |
    **圧縮完了！**

    - 圧縮されたメッセージ数：{count}
    **圧縮サマリー：**
    {summary}
    - サマリータスクがバックグラウンドで開始されました
  ru: |
    **Сжатие завершено!**

    - Сжато сообщений: {count}
    **Сжатая сводка:**
    {summary}
    - Задача сводки запущена в фоне

command.compact.set_summary_error:
  zh: |
    设置摘要失败：{error}
  en: |
    Failed to set summary: {error}
  ja: |
    サマリーの設定に失敗しました：{error}
  ru: |
    Не удалось установить сводку: {error}

command.new.no_messages:
  zh: |
    **没有消息可总结。**

    - 当前上下文为空
    - 压缩摘要已清除
    - 未执行任何操作
  en: |
    **No messages to summarize.**

    - Current context is empty
    - Compressed summary is clear
    - No action taken
  ja: |
    **要約するメッセージがありません。**

    - 現在のコンテキストは空です
    - 圧縮サマリーはクリアされています
    - 操作は行われませんでした
  ru: |
