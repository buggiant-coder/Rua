    - Невозможно начать новый разговор со сводкой
    - Включите менеджер памяти для использования этой функции

command.new.done:
  zh: |
    **新对话已开始！**

    - 摘要任务已在后台启动
    - 准备开始新对话
  en: |
    **New Conversation Started!**

    - Summary task started in background
    - Ready for new conversation
  ja: |
    **新しい会話を開始しました！**

    - サマリータスクがバックグラウンドで開始されました
    - 新しい会話の準備ができました
  ru: |
    **Новый разговор начат!**

    - Задача сводки запущена в фоне
    - Готов к новому разговору

