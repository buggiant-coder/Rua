    **提示词文件已重置为智能体默认值。**
  en: |
    **Prompt files reset to agent defaults.**
  ja: |
    **プロンプトファイルをエージェントのデフォルトにリセットしました。**
  ru: |
    **Файлы промптов сброшены к значениям агента по умолчанию.**

command.prompt.usage:
  zh: |
    **用法：**
    - `/prompt add <文件>` — 添加提示词文件
    - `/prompt remove <文件>` — 移除提示词文件
    - `/prompt reset` — 恢复智能体默认值
  en: |
    **Usage:**
    - `/prompt add <file>` — add a prompt file
    - `/prompt remove <file>` — remove a prompt file
    - `/prompt reset` — restore agent defaults
  ja: |
    **使用法：**
    - `/prompt add <ファイル>` — プロンプトファイルを追加
    - `/prompt remove <ファイル>` — プロンプトファイルを削除
    - `/prompt reset` — エージェントのデフォルトに戻す
  ru: |
    **Использование:**
    - `/prompt add <файл>` — добавить файл промпта
    - `/prompt remove <файл>` — удалить файл промпта
    - `/prompt reset` — восстановить значения агента по умолчанию

